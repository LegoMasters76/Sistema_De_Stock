<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Activación de Software</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .activation-card {
            max-width: 500px;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="activation-card bg-white p-5">
    <div class="text-center mb-4">
        <i class="bi bi-shield-lock text-primary" style="font-size: 4rem;"></i>
        <h2 class="mt-3">Activación del Sistema</h2>
        <p class="text-muted">Por favor, ingrese su licencia para continuar.</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Nombre del Cliente / Empresa</label>
            <input type="text" name="cliente" class="form-control form-control-lg" value="{{ cliente|default:'' }}" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Código Serial</label>
            <input type="text" name="serial" class="form-control form-control-lg text-center" placeholder="XXXX-XXXX-XXXX" value="{{ serial|default:'' }}" style="letter-spacing: 2px;" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100"><i class="bi bi-key"></i> Activar Software</button>
    </form>
    
    <div class="text-center mt-4">
        <small class="text-muted">¿Necesita una licencia? Contacte al desarrollador.</small>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
