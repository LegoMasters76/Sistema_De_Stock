{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4"><i class="bi bi-person-plus"></i> Agregar Nuevo Cliente</h2>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="card p-4 shadow-sm border-0">
                    {{ form.as_p }}
                    
                    <div class="mt-4">
                        <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Guardar Cliente</button>
                        <a href="{% url 'ventas:venta_create' %}" class="btn btn-outline-secondary ms-2">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .errorlist { color: #dc3545; list-style: none; padding: 0; margin-top: 5px; font-size: 0.875em; }
</style>
{% endblock %}
